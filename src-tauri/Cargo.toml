[package]
name = "fangnet-desktop"
version = "0.1.0"
description = "Native desktop hub for Kiefer's self-hosted FangNet services"
authors = ["Kiefer D. Hendricks"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

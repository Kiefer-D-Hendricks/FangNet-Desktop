name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only upload on tag builds; empty on branch builds means "skip uploads".
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'FangNet Desktop v__VERSION__'
          releaseBody: |-
            First release of FangNet Desktop — your hub for the FangNet universe: Community, Chat, Cloud, and FangOS.

            **Downloads**
            - Windows: .msi installer and NSIS setup .exe
            - Linux: .AppImage and .deb
            - macOS: .dmg (unsigned — on first launch, right-click the app and choose Open)

      - name: Strip bundled libwayland from AppImage
        # Workaround for tauri-apps/tauri#11988: linuxdeploy bundles
        # libwayland-*.so* into the AppImage, but the host Mesa EGL stack
        # must load the *system* libwayland-client. The stale bundled copy
        # makes WebKitGTK abort at startup with:
        #   "Could not create default EGL display: EGL_BAD_PARAMETER. Aborting..."
        # So repack the AppImage without those libraries and re-upload it.
        if: matrix.platform == 'ubuntu-latest' && github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ github.ref_name }}"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          gh release download "$TAG" --pattern '*.AppImage'
          APPIMAGE="$(ls *.AppImage)"
          ./"$APPIMAGE" --appimage-extract
          rm -f squashfs-root/usr/lib/libwayland-*.so*
          if ls squashfs-root/usr/lib/libwayland-* >/dev/null 2>&1; then
            echo "ERROR: libwayland still bundled!" >&2
            exit 1
          fi
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$APPIMAGE"
          gh release upload "$TAG" "$APPIMAGE" --clobber

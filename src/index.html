<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FangNet Desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hub">
    <img src="assets/logo.png" alt="FangNet" class="logo" />
    <h1>FangNet <span>Desktop</span></h1>
    <p class="tagline">Your services. One bite.</p>
    <div class="grid">
      <button class="card" data-service="community">
        <span class="card-title">Community</span>
        <span class="card-desc">The FangNet forums &amp; link boards</span>
        <span class="card-url">fangnet.me</span>
      </button>
      <button class="card" data-service="chat">
        <span class="card-title">Chat</span>
        <span class="card-desc">Real-time chat with the crew</span>
        <span class="card-url">chat.fangnet.me</span>
      </button>
      <button class="card" data-service="cloud">
        <span class="card-title">Cloud</span>
        <span class="card-desc">Files, notes &amp; everything synced</span>
        <span class="card-url">cloud.fangnet.me</span>
      </button>
      <button class="card" data-service="fangos">
        <span class="card-title">FangOS</span>
        <span class="card-desc">The distro behind it all</span>
        <span class="card-url">os.fangnet.me</span>
      </button>
    </div>
    <footer>Built different &mdash; self-hosted by Kiefer D. Hendricks</footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
